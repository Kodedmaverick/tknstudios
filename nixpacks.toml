# Nixpacks build config for TKN Studios (Vite + React static site).
# Builds to /dist. Served statically via Caddy (production-grade static file
# server), NOT `vite preview` — vite preview is a dev tool, not meant for
# production, and its Host-header allowlist rejects requests coming through
# a reverse proxy/custom domain, which is what causes 502 Bad Gateway here.

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_20", "caddy"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[staticAssets]
"Caddyfile" = ':{$PORT} {\n\troot * /app/dist\n\tencode gzip\n\ttry_files {path} /index.html\n\tfile_server\n}\n'

[start]
cmd = "caddy run --config /app/Caddyfile --adapter caddyfile 2>&1"
